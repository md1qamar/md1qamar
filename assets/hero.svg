    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.45" />
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)" />
  <rect width="1200" height="320" rx="18" fill="url(#grid)" />
  <rect width="1200" height="320" rx="18" fill="url(#glow1)" />
  <rect width="1200" height="320" rx="18" fill="url(#glow2)" />
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Top left category badge -->
