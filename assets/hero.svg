  <circle cx="84" cy="63" r="4.5" fill="#34D399" />
  <text x="100" y="68" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.4">OPEN SOURCE · DEVTOOLS · AI CODING AGENTS</text>

  <!-- Name and subtitle -->
  <text x="64" y="142" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.8">Mohammed Qamar</text>
  <text x="64" y="186" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500">DevTools Builder &amp; Custom Software Architect</text>

