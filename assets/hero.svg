    <circle cx="24" cy="24" r="5" fill="#EF4444" opacity="0.85" />
    <circle cx="42" cy="24" r="5" fill="#F59E0B" opacity="0.85" />
    <circle cx="60" cy="24" r="5" fill="#10B981" opacity="0.85" />
    <text x="82" y="28" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">ship-loop.ts</text>
    <line x1="0" y1="44" x2="328" y2="44" stroke="#1E293B" stroke-width="1" />

    <text x="22" y="74" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">$ discover</text>
    <text x="118" y="74" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">trending dev problems</text>

    <text x="22" y="106" fill="#818CF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">$ build</text>
