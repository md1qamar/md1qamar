    <text x="22" y="138" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">$ gate</text>
    <text x="118" y="138" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">secret-scan &amp; CI green</text>

    <text x="22" y="170" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">$ ship</text>
    <text x="118" y="170" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">open-source to GitHub</text>
