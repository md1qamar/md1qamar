      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="18%" cy="82%" r="45%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
