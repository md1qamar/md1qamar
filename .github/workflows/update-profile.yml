name: Update Profile README

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_profile.mjs"
      - "README.md"

permissions:
  contents: write

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run profile generator tests
        run: node --test test/update_profile.test.mjs
      - name: Sync live repositories and stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update_profile.mjs
      - name: Commit updated README and stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stats-card.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync profile repositories and telemetry"
            git push
          fi
